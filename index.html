<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WeatherX</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="./styles/main.css" />

    <!-- Home CSS -->
    <link rel="stylesheet" href="./styles/home.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <script src="./scripts/theme.js"></script>
  <!-- AI Chat -->

  <div id="chat-toggle">🤖</div>

  <div id="chat-box">
    <div id="chat-header">Weather Assistant</div>

    <div id="chat-messages">
      <div class="bot-message">Xin chào 👋</div>
    </div>

    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Ask something..." />

      <button id="send-btn">Send</button>
    </div>
  </div>
  <script src="scripts/chatbot.js"></script>
  <body>
    <!-- Navbar -->

    <header>
      <nav>
        <a href="./index.html" class="logo"> WeatherX </a>

        <ul class="nav-links">
          <li>
            <a href="./index.html"> Home </a>
          </li>

          <li>
            <a href="./search.html"> Search </a>
          </li>
        </ul>

        <button id="theme-toggle" class="btn btn-secondary">🌙</button>

        <div class="auth-buttons">
          <a href="./login.html">
            <button class="btn btn-secondary">Login</button>
          </a>

          <a href="./register.html">
            <button class="btn btn-primary">Register</button>
          </a>
        </div>
      </nav>
    </header>

    <div class="auth-buttons">
      <span id="user-name"></span>

      <button id="logout-btn" class="btn btn-secondary">Logout</button>
    </div>

    <!-- Hero Section -->

    <section class="hero-section">
      <img src="./assets/hero.jpg" alt="Hero" class="hero-image" />

      <div class="hero-overlay">
        <h1>WeatherX</h1>

        <p>Explore weather around the world</p>

        <a href="./search.html">
          <button class="btn btn-primary">Search Cities</button>
        </a>
      </div>
    </section>

    <!-- Your Location -->

    <section class="section">
      <h2 class="section-title">Your Location</h2>

      <div id="my-location" class="city-container"></div>
    </section>

    <!-- Facorite Cities -->
    <section class="section">
      <h2 class="section-title">Favorite Cities ❤️</h2>

      <div id="favorite-cities" class="city-container"></div>
    </section>

    <section class="section">
      <h2 class="section-title">🏆 Best Cities To Travel Today</h2>

      <div id="travel-ranking" class="city-container"></div>
    </section>

    <!-- Featured Cities -->

    <section class="section">
      <h2 class="section-title">Featured Cities</h2>

      <div id="featured-cities" class="city-container"></div>
    </section>

    <!-- Air Quality Ranking -->

    <section class="section">
      <h2 class="section-title">Air Quality Ranking</h2>

      <div id="aqi-cities" class="city-container"></div>
    </section>

    <!-- Footer -->

    <footer>
      <p>© 2026 WeatherX</p>
    </footer>

    <!-- JS -->

    <script type="module" src="./scripts/home.js"></script>
  </body>
</html>
