<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | WeatherX</title>

    <link
        rel="stylesheet"
        href="./styles/main.css"
    >

    <link
        rel="stylesheet"
        href="./styles/login.css"
    >

</head>

<body>

    <div class="auth-page">

        <div class="auth-left">

            <h1>WeatherX</h1>

            <p>
                Explore weather around the world.
            </p>

        </div>

        <div class="auth-right">

            <form id="login-form">

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Login to continue
                </p>

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Login
                </button>

                <p class="switch-page">

                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>

                </p>

                <a
                    href="index.html"
                    class="back-home"
                >
                    ← Back Home
                </a>

            </form>

        </div>

    </div>

    <script src="./scripts/login.js"></script>

</body>

</html>
