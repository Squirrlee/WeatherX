<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Register - WeatherX</title>

    <link
        rel="stylesheet"
        href="styles/main.css"
    >

    <link
        rel="stylesheet"
        href="styles/register.css"
    >

</head>

<body>

    <div class="auth-container">

        <form id="register-form">

            <h1>Register</h1>

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="btn btn-primary"
            >
                Register
            </button>

            <p>

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </form>

    </div>

    <script src="scripts/register.js"></script>

</body>

</html>
