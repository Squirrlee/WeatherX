<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search Cities | WeatherX</title>

    <link
        rel="stylesheet"
        href="./styles/main.css"
    >

    <link
        rel="stylesheet"
        href="./styles/search.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <!-- AI Chat -->

    <div id="chat-toggle">🤖</div>

    <div id="chat-box">

        <div id="chat-header">
            Weather Assistant
        </div>

        <div id="chat-messages">

            <div class="bot-message">
                Xin chào 👋
            </div>

        </div>

        <div id="chat-input-area">

            <input
                type="text"
                id="chat-input"
                placeholder="Ask something..."
            >

            <button id="send-btn">
                Send
            </button>

        </div>

    </div>

    <!-- Navbar -->

    <header>

        <nav>

            <a
                href="./index.html"
                class="logo"
            >
                WeatherX
            </a>

            <ul class="nav-links">

                <li>
                    <a href="./index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="./search.html">
                        Search
                    </a>
                </li>

            </ul>

            <button
                id="theme-toggle"
                class="btn btn-secondary"
            >
                🌙
            </button>

            <div class="auth-buttons">

                <a href="./login.html">
                    <button class="btn btn-secondary">
                        Login
                    </button>
                </a>

                <a href="./register.html">
                    <button class="btn btn-primary">
                        Register
                    </button>
                </a>

            </div>

        </nav>

    </header>

    <!-- Search Hero -->

    <section class="search-section">

        <h1>
            Search Weather
        </h1>

        <p class="search-subtitle">
            Explore weather and air quality around the world
        </p>

        <form id="search-form">

            <div class="search-container">

                <input
                    id="search-input"
                    type="text"
                    placeholder="Enter city name..."
                    required
                >

                <button
                    class="btn btn-primary"
                    type="submit"
                >

                    <i class="fa-solid fa-magnifying-glass"></i>

                    Search

                </button>

            </div>

        </form>

    </section>

    <!-- Search Results -->

    <section class="section">

        <h2 class="section-title">
            🔍 Search Results
        </h2>

        <div
            id="search-results"
            class="city-container"
        ></div>

    </section>

    <!-- Recent Searches -->

    <section class="section">

        <h2 class="section-title">
            🕒 Recent Searches
        </h2>

        <div
            id="recent-searches"
            class="city-container"
        ></div>

    </section>

    <!-- Footer -->

    <footer>

        <h3>
            WeatherX
        </h3>

        <p>
            Explore weather around the world
        </p>

        <p>
            © 2026 WeatherX
        </p>

    </footer>

    <!-- Scripts -->

    <script src="./scripts/theme.js"></script>

    <script src="./scripts/chatbot.js"></script>

    <script
        type="module"
        src="./scripts/search.js"
    ></script>

</body>
</html>
